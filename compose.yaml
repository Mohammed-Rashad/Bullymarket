services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bullymarket
      POSTGRES_USER: bullymarket
      POSTGRES_PASSWORD: bullymarket
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bullymarket -d bullymarket"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bullymarket-postgres:/var/lib/postgresql/data

volumes:
  bullymarket-postgres:

